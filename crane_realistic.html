function rb(w,h,d,r=0.06){ return new RoundedBoxGeometry(w,h,d,4,Math.min(r,w/2.05,h/2.05,d/2.05)); }

function P(geo,mat,x,y,z,rx=0,ry=0,rz=0,grp=truck){
  const m=new THREE.Mesh(geo,mat);
  m.position.set(x,y,z); m.rotation.set(rx,ry,rz);
  grp.add(m); return m;
}

// extrude a 2D profile that lives in (length=shapeX, height=shapeY) and
// extrude across width → returns geom oriented: length→+Z, height→+Y, width→X(centered)
function sideExtrude(shape, width, bevel=0.04){
  const g=new THREE.ExtrudeGeometry(shape,{depth:width,bevelEnabled:true,bevelThickness:bevel,bevelSize:bevel,bevelSegments:2,curveSegments:32});
  g.translate(0,0,-width/2);
  g.rotateY(-Math.PI/2);
  g.computeVertexNormals();
  return g;
}

// tube along a list of [x,y,z] points
function tube(points,r,seg=24,rad=6){
  const curve=new THREE.CatmullRomCurve3(points.map(p=>new THREE.Vector3(...p)));
  return new THREE.TubeGeometry(curve,seg,r,rad,false);
}

// ── Front fenders (curved arches over front wheels)
function fender(px,cz,innerR,thick,wid){
  const s=new THREE.Shape();
  s.absarc(0,0,innerR+thick,Math.PI*0.04,Math.PI*0.96,false);
  s.absarc(0,0,innerR,Math.PI*0.96,Math.PI*0.04,true);
  const g=new THREE.ExtrudeGeometry(s,{depth:wid,bevelEnabled:true,bevelThickness:0.015,bevelSize:0.015,bevelSegments:2,curveSegments:28});
  g.translate(0,0,-wid/2); g.rotateY(-Math.PI/2); g.computeVertexNormals();
  P(g, M.body, px,0.45,cz);
}

// ════════════════ WHEELS ════════════════
function wheel(x,z){
  const g=new THREE.Group();
  const tire=new THREE.Mesh(new THREE.CylinderGeometry(0.45,0.45,0.34,14),M.tire);
  tire.rotation.z=Math.PI/2; g.add(tire);
  // rounded sidewalls
  [0.15,-0.15].forEach(o=>{const t=new THREE.Mesh(new THREE.TorusGeometry(0.4,0.06,8,14),M.tire);t.rotation.y=Math.PI/2;t.position.x=o;g.add(t);});
  // rim
  const rimm=new THREE.Mesh(new THREE.CylinderGeometry(0.27,0.27,0.36,16),M.rim);
  rimm.rotation.z=Math.PI/2; g.add(rimm);
  // dish + hub
  const dish=new THREE.Mesh(new THREE.CylinderGeometry(0.24,0.24,0.04,16),M.rim); dish.rotation.z=Math.PI/2; dish.position.x=0.17; g.add(dish);
  const hub=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.09,0.42,12),M.chrome); hub.rotation.z=Math.PI/2; g.add(hub);
  // spokes
  for(let i=0;i<6;i++){const a=(i/6)*Math.PI*2;const sp=new THREE.Mesh(new THREE.BoxGeometry(0.04,0.32,0.05),M.rim);sp.position.set(0.17,Math.sin(a)*0.15,Math.cos(a)*0.15);sp.rotation.x=-a;g.add(sp);}
  // lug nuts
  for(let i=0;i<8;i++){const a=(i/8)*Math.PI*2;const lug=new THREE.Mesh(new THREE.CylinderGeometry(0.028,0.028,0.44,6),M.steel);lug.rotation.z=Math.PI/2;lug.position.set(0,Math.sin(a)*0.18,Math.cos(a)*0.18);g.add(lug);}
  g.position.set(x,0.45,z); truck.add(g);
}

}

// rounded oval cross-section, extruded along local +Y, base at y=0
function ovalShape(w,h,r){
  const s=new THREE.Shape(); const x=w/2,y=h/2;
  s.moveTo(-x+r,-y); s.lineTo(x-r,-y); s.quadraticCurveTo(x,-y,x,-y+r);
  s.lineTo(x,y-r); s.quadraticCurveTo(x,y,x-r,y); s.lineTo(-x+r,y);
  s.quadraticCurveTo(-x,y,-x,y-r); s.lineTo(-x,-y+r); s.quadraticCurveTo(-x,-y,-x+r,-y);
  return s;
}
function boomSec(w,h,len,baseY){
  const g=new THREE.ExtrudeGeometry(ovalShape(w,h,Math.min(w,h)*0.45),{depth:len,bevelEnabled:false,curveSegments:16});
  g.rotateX(-Math.PI/2); g.computeVertexNormals();  // extrude Z → +Y
  P(g, M.boom, 0, baseY, 0, 0,0,0, boom);
}

// ════════════════ SCROLL-DRIVEN ROTATION ════════════════
// parent page posts { type:'scroll', ratio:0..1 } messages
const INIT_ROT = -(100 * Math.PI / 180); // 100° counter-clockwise
let scrollRot = INIT_ROT, targetRot = INIT_ROT;
truck.rotation.y = INIT_ROT;
window.addEventListener('message', e => {
  if (e.data && e.data.type === 'scroll') {
    targetRot = INIT_ROT + e.data.ratio * Math.PI * 6;
  }
});

// ════════════════ LOOP ════════════════
function tick(){
  requestAnimationFrame(tick);
  // smooth lerp toward scroll target
  scrollRot += (targetRot - scrollRot) * 0.08;
  truck.rotation.y = scrollRot;
  controls.update();
  renderer.render(scene,camera);
}
tick();
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
